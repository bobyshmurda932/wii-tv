<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wii TV Launcher</title>
    <style>
        :root {
            --wii-blue: #00c3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Fond uni léger pour soulager le processeur de la TV */
            background-color: #e4e9ed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Grille principale des chaînes (4x3) */
        .channels-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3vh 5vw 1vh 5vw;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2.2vh 2vw;
            width: 100%;
            max-width: 1500px;
            height: 72vh;
        }

        /* Style d'une chaîne Wii optimisé GPU (Zéro lag) */
        .channel {
            position: relative;
            border-radius: 24px;
            background: #ffffff;
            border: 4px solid #b8c4cc;
            overflow: hidden;
            cursor: pointer;
            transform: translate3d(0, 0, 0);
            will-change: transform;
            transition: transform 0.14s ease-out, border-color 0.14s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        /* Reflet supérieur simplifié sans calcul lourd */
        .channel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 20px 20px 50% 50% / 20px 20px 20% 20%;
            z-index: 4;
            pointer-events: none;
        }

        /* État sélectionné ultra-réactif */
        .channel.focused,
        .channel:hover,
        .channel:focus {
            transform: translate3d(0, 0, 0) scale(1.07);
            border-color: var(--wii-blue);
            border-width: 6px;
            z-index: 10;
        }

        /* Animation de lancement */
        .channel.launching {
            transform: translate3d(0, 0, 0) scale(1.18);
            opacity: 0.85;
            transition: transform 0.2s ease-in, opacity 0.2s ease-in;
        }

        .channel-bg {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .channel-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 100%;
            padding: 10px 18px;
        }

        /* Logos principaux sans drop-shadow (gain massif de FPS sur TV) */
        .channel-icon {
            width: 112px;
            height: 112px;
            min-width: 112px;
            min-height: 112px;
            flex-shrink: 0;
            display: block;
            object-fit: contain;
            overflow: visible;
        }

        .channel-logo-name {
            height: 44px;
            max-width: 80%;
            flex-shrink: 0;
            object-fit: contain;
        }

        /* Image Twitch_Logo-removebg-preview.png doublée */
        .logo-twitch {
            height: 165px;
            width: 145%;
            max-width: none;
            margin-top: -38px;
            margin-bottom: -32px;
        }

        .logo-animesama {
            height: 46px;
            max-width: 84%;
        }

        /* Image Google-logo-text.png doublée */
        .logo-google {
            height: 92px;
            width: 110%;
            max-width: none;
            margin-top: -12px;
            margin-bottom: -14px;
        }

        /* Texte sans contour ni boîte autour */
        .channel-label {
            background: transparent;
            border: none;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: 0.6px;
            flex-shrink: 0;
        }

        /* Couleurs franches et légères pour la TV */
        .bg-youtube { background: linear-gradient(180deg, #ff3030 0%, #a30000 100%); }
        .bg-spotify { background: linear-gradient(180deg, #1ed760 0%, #0b5e26 100%); }
        .bg-twitch  { background: linear-gradient(180deg, #9d5cff 0%, #4b149e 100%); }
        .bg-google  { background: #f4f7fa; }
        .bg-anime   { background: linear-gradient(135deg, #111827 0%, #4c1d95 55%, #be123c 100%); }
        .bg-netflix { background: #0f0f0f; }
        .bg-disney  { background: #0a1438; }

        .disney-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
        }

        .netflix-logo {
            width: 86%;
            max-width: 260px;
            height: auto;
            overflow: visible;
        }

        /* Chaînes vides optimisées (sans repeating-gradient lourd) */
        .channel.empty {
            background-color: #d2d9df;
            border-color: #bfc8d0;
        }

        .channel.empty .wii-watermark {
            font-size: 2rem;
            font-weight: 800;
            color: #adb8c2;
            letter-spacing: 2px;
            z-index: 2;
        }

        /* Barre inférieure incurvée de la Wii */
        .wii-bottom-bar {
            height: 18vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5vw;
            background: #cfd8df;
            border-top: 4px solid var(--wii-blue);
            border-radius: 50% 50% 0 0 / 24px 24px 0 0;
        }

        .wii-pill-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #f5f7f9;
            border: 3px solid #a3b2bd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.3rem;
            color: #5c6a76;
            cursor: pointer;
        }

        .wii-pill-btn:hover,
        .wii-pill-btn.focused {
            border-color: var(--wii-blue);
            border-width: 5px;
        }

        .wii-clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wii-time {
            font-size: 3.4rem;
            font-weight: 700;
            color: #55626d;
            letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
        }

        .wii-date {
            font-size: 1.3rem;
            font-weight: 600;
            color: #687682;
            margin-top: -4px;
        }
    </style>
</head>
<body>

    <!-- GRILLE DES 12 CHAÎNES -->
    <div class="channels-wrapper">
        <div class="channels-grid" id="grid">
            
            <!-- 1. YOUTUBE -->
            <div class="channel active-app focused" tabindex="0" data-index="0" data-url="https://www.youtube.com">
                <div class="channel-bg bg-youtube"></div>
                <div class="channel-content">
                    <svg class="channel-icon" xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 24 24" fill="#ffffff">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    <img class="channel-logo-name" src="youtube.png" alt="YouTube" style="display:none;" onload="this.style.display='block'; this.nextElementSibling.style.display='none';">
                    <span class="channel-label">YouTube</span>
                </div>
            </div>

            <!-- 2. SPOTIFY -->
            <div class="channel active-app" tabindex="0" data-index="1" data-url="https://open.spotify.com">
                <div class="channel-bg bg-spotify"></div>
                <div class="channel-content">
                    <svg class="channel-icon" xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 24 24" fill="#ffffff">
                        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                    </svg>
                    <img class="channel-logo-name" src="spotify.png" alt="Spotify" style="display:none;" onload="this.style.display='block'; this.nextElementSibling.style.display='none';">
                    <span class="channel-label">Spotify</span>
                </div>
            </div>

            <!-- 3. TWITCH -->
            <div class="channel active-app" tabindex="0" data-index="2" data-url="https://www.twitch.tv">
                <div class="channel-bg bg-twitch"></div>
                <div class="channel-content">
                    <svg class="channel-icon" xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 24 24" fill="#ffffff">
                        <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                    </svg>
                    <img class="channel-logo-name logo-twitch" src="Twitch_Logo-removebg-preview.png" alt="Twitch">
                </div>
            </div>

            <!-- 4. ANIME-SAMA -->
            <div class="channel active-app" tabindex="0" data-index="3" data-url="https://anime-sama.to">
                <div class="channel-bg bg-anime"></div>
                <div class="channel-content">
                    <img class="channel-icon" src="61pfGOfxjmL.png" alt="Anime-Sama Icon">
                    <img class="channel-logo-name logo-animesama" src="images-removebg-preview.png" alt="Anime-Sama">
                </div>
            </div>

            <!-- 5. GOOGLE -->
            <div class="channel active-app" tabindex="0" data-index="4" data-url="https://www.google.fr">
                <div class="channel-bg bg-google"></div>
                <div class="channel-content">
                    <img class="channel-icon" src="Google_logo.png" alt="Google Icon">
                    <img class="channel-logo-name logo-google" src="Google-logo-text.png" alt="Google">
                </div>
            </div>

            <!-- 6. DISNEY+ -->
            <div class="channel active-app" tabindex="0" data-index="5" data-url="https://www.disneyplus.com">
                <div class="channel-bg bg-disney"></div>
                <img class="disney-img" src="disney.png" alt="Disney+" onerror="if(this.src.endsWith('disney.png')) this.src='disney.jpg';">
            </div>

            <!-- 7. NETFLIX -->
            <div class="channel active-app" tabindex="0" data-index="6" data-url="https://www.netflix.com">
                <div class="channel-bg bg-netflix"></div>
                <div class="channel-content">
                    <svg class="netflix-logo" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -15 600 160" fill="#E50914">
                        <path d="M10 10 H32 L62 82 V10 H84 V120 H62 L32 48 V120 H10 Z"/>
                        <path d="M102 10 H162 V30 H124 V54 H154 V74 H124 V100 H164 V120 H102 Z"/>
                        <path d="M178 10 H246 V30 H223 V120 H201 V30 H178 Z"/>
                        <path d="M262 10 H322 V30 H284 V56 H314 V76 H284 V120 H262 Z"/>
                        <path d="M338 10 H360 V100 H396 V120 H338 Z"/>
                        <path d="M412 10 H434 V120 H412 Z"/>
                        <path d="M452 10 H476 L492 48 L508 10 H532 L504 65 L534 120 H510 L492 82 L474 120 H450 L480 65 Z"/>
                    </svg>
                </div>
            </div>

            <!-- 8 à 12 : CHAÎNES VIDES -->
            <div class="channel empty" tabindex="0" data-index="7"><span class="wii-watermark">Wii</span></div>
            <div class="channel empty" tabindex="0" data-index="8"><span class="wii-watermark">Wii</span></div>
            <div class="channel empty" tabindex="0" data-index="9"><span class="wii-watermark">Wii</span></div>
            <div class="channel empty" tabindex="0" data-index="10"><span class="wii-watermark">Wii</span></div>
            <div class="channel empty" tabindex="0" data-index="11"><span class="wii-watermark">Wii</span></div>

        </div>
    </div>

    <!-- BARRE INFÉRIEURE WII -->
    <div class="wii-bottom-bar">
        <div class="wii-pill-btn" id="wiiBtn">Wii</div>
        <div class="wii-clock-container">
            <div class="wii-time" id="clock">12:00</div>
            <div class="wii-date" id="date">Jeu 29/10</div>
        </div>
        <div class="wii-pill-btn" id="installBtn" title="Installer sur VIDAA">TV</div>
    </div>

    <script>
        // --- 1. SYNTHÉTISEUR AUDIO WII ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playWiiSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'hover') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(540, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.05);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.055);
                    osc.start(now);
                    osc.stop(now + 0.055);
                } else if (type === 'select') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.07);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {}
        }

        // --- 2. HORLOGE LÉGÈRE (Mise à jour toutes les 10s au lieu de 1s pour économiser le CPU TV) ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            const days = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
            const dayName = days[now.getDay()];
            const dayNum = String(now.getDate()).padStart(2, '0');
            const monthNum = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('date').textContent = `${dayName} ${dayNum}/${monthNum}`;
        }
        setInterval(updateClock, 10000);
        updateClock();

        // --- 3. NAVIGATION TÉLÉCOMMANDE TV & SOURIS ---
        const channels = Array.from(document.querySelectorAll('.channel'));
        let currentIndex = 0;
        const COLS = 4;

        function setFocus(index) {
            if (index < 0 || index >= channels.length) return;
            channels[currentIndex].classList.remove('focused');
            currentIndex = index;
            channels[currentIndex].classList.add('focused');
            channels[currentIndex].focus({ preventScroll: true });
            playWiiSound('hover');
        }

        function launchChannel(channelEl) {
            const url = channelEl.getAttribute('data-url');
            if (!url) return;
            playWiiSound('select');
            channelEl.classList.add('launching');
            setTimeout(() => {
                window.location.href = url;
            }, 180);
        }

        channels.forEach((ch, idx) => {
            ch.addEventListener('mouseenter', () => {
                if (currentIndex !== idx) setFocus(idx);
            });
            ch.addEventListener('click', () => {
                setFocus(idx);
                launchChannel(ch);
            });
        });

        // Support complet des codes touches télécommande Hisense / VIDAA / CE-HTML
        window.addEventListener('keydown', (e) => {
            const key = e.key;
            const code = e.keyCode || e.which;

            if (key === 'ArrowRight' || code === 39 || code === 4) {
                e.preventDefault();
                if (currentIndex < channels.length - 1) setFocus(currentIndex + 1);
            } else if (key === 'ArrowLeft' || code === 37 || code === 3) {
                e.preventDefault();
                if (currentIndex > 0) setFocus(currentIndex - 1);
            } else if (key === 'ArrowDown' || code === 40 || code === 2) {
                e.preventDefault();
                if (currentIndex + COLS < channels.length) setFocus(currentIndex + COLS);
            } else if (key === 'ArrowUp' || code === 38 || code === 1) {
                e.preventDefault();
                if (currentIndex - COLS >= 0) setFocus(currentIndex - COLS);
            } else if (key === 'Enter' || code === 13 || code === 29443) {
                e.preventDefault();
                launchChannel(channels[currentIndex]);
            }
        });

        // --- 4. BOUTON "TV" EN BAS À DROITE : INSTALLATION DIRECTE SUR L'ACCUEIL VIDAA ---
        document.getElementById('installBtn').addEventListener('click', () => {
            playWiiSound('select');
            const appUrl = "https://bobyshmurda932.github.io/wii-tv/";
            const iconUrl = "https://bobyshmurda932.github.io/wii-tv/Google_logo.png";

            if (typeof Hisense_installApp === "function") {
                Hisense_installApp("wii_tv_launcher", "Wii Menu", iconUrl, iconUrl, appUrl, "store", function(res) {
                    alert("Wii Menu a été installé sur l'écran d'accueil de ta télé !");
                });
            } else {
                alert("Astuce : Ouvre le menu en haut à droite du navigateur de ta télé et clique sur 'Ajouter à l'écran d'accueil' ou 'Définir comme page d'accueil'.");
            }
        });
    </script>
</body>
</html>
