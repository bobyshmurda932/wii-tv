<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wii TV Launcher</title>
    <style>
        :root {
            --wii-blue: #00c3ff;
            --wii-blue-glow: rgba(0, 195, 255, 0.65);
            --bg-stripe-1: #e8ecef;
            --bg-stripe-2: #dfe4e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: repeating-linear-gradient(
                0deg,
                var(--bg-stripe-1),
                var(--bg-stripe-1) 6px,
                var(--bg-stripe-2) 6px,
                var(--bg-stripe-2) 12px
            );
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Grille principale des chaînes (4x3) */
        .channels-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3vh 5vw 1vh 5vw;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2.2vh 2vw;
            width: 100%;
            max-width: 1500px;
            height: 72vh;
        }

        /* Style d'une chaîne Wii */
        .channel {
            position: relative;
            border-radius: 26px;
            background: #ffffff;
            border: 4px solid #b8c4cc;
            box-shadow: 
                0 6px 15px rgba(0, 0, 0, 0.1),
                inset 0 0 15px rgba(255, 255, 255, 0.8);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
                        border-color 0.2s ease,
                        box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        /* Reflet glossy supérieur type Wii */
        .channel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 48%;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.45) 0%,
                rgba(255, 255, 255, 0.04) 100%
            );
            border-radius: 22px 22px 60% 60% / 22px 22px 25% 25%;
            z-index: 4;
            pointer-events: none;
        }

        /* État sélectionné (Télécommande ou Souris) */
        .channel.focused,
        .channel:hover {
            transform: scale(1.08);
            border-color: var(--wii-blue);
            box-shadow: 
                0 14px 28px rgba(0, 0, 0, 0.25),
                0 0 22px var(--wii-blue-glow),
                inset 0 0 12px rgba(255, 255, 255, 0.9);
            z-index: 10;
        }

        /* Animation de lancement */
        .channel.launching {
            transform: scale(1.25);
            filter: brightness(1.3);
            transition: all 0.35s ease-in;
        }

        /* Contenu interne des chaînes actives */
        .channel-bg {
            position: absolute;
            inset: 0;
            z-index: 1;
            transition: transform 0.5s ease;
        }

        .channel.focused .channel-bg,
        .channel:hover .channel-bg {
            transform: scale(1.1);
        }

        .channel-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 100%;
            padding: 10px 18px;
        }

        /* Logos principaux agrandis et verrouillés */
        .channel-icon {
            width: 112px;
            height: 112px;
            min-width: 112px;
            min-height: 112px;
            flex-shrink: 0;
            display: block;
            object-fit: contain;
            overflow: visible;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .channel.focused .channel-icon,
        .channel:hover .channel-icon {
            transform: scale(1.14) rotate(-2deg);
        }

        /* Style de base pour les images de noms de chaînes */
        .channel-logo-name {
            height: 44px;
            max-width: 80%;
            flex-shrink: 0;
            object-fit: contain;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.35));
            transition: transform 0.25s ease;
        }

        /* Image Twitch_Logo-removebg-preview.png doublée */
        .logo-twitch {
            height: 165px;
            width: 145%;
            max-width: none;
            margin-top: -38px;
            margin-bottom: -32px;
        }

        .logo-animesama {
            height: 46px;
            max-width: 84%;
        }

        /* Image Google-logo-text.png doublée */
        .logo-google {
            height: 92px;
            width: 110%;
            max-width: none;
            margin-top: -12px;
            margin-bottom: -14px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.15));
        }

        .channel.focused .channel-logo-name,
        .channel:hover .channel-logo-name {
            transform: translateY(-2px) scale(1.08);
        }

        /* Texte sans contour ni boîte autour (YouTube, Spotify) */
        .channel-label {
            background: transparent;
            border: none;
            box-shadow: none;
            -webkit-text-stroke: 0;
            color: #ffffff;
            font-weight: 800;
            font-size: 1.35rem;
            letter-spacing: 0.6px;
            text-shadow: none;
            flex-shrink: 0;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        .channel.focused .channel-label,
        .channel:hover .channel-label {
            transform: translateY(-2px) scale(1.05);
        }

        /* Thèmes par application */
        .bg-youtube { background: radial-gradient(circle at center, #ff3b3b 0%, #990000 100%); }
        .bg-spotify { background: radial-gradient(circle at center, #1ed760 0%, #0a5221 100%); }
        .bg-twitch  { background: radial-gradient(circle at center, #a970ff 0%, #4b149e 100%); }
        .bg-google  { background: radial-gradient(circle at center, #ffffff 0%, #dce3ea 100%); }
        .bg-anime   { background: linear-gradient(135deg, #0f172a 0%, #3b0764 50%, #be123c 100%); }
        .bg-netflix { background: radial-gradient(circle at center, #1f1f1f 0%, #000000 100%); }

        /* Chaîne Disney+ */
        .bg-disney {
            background: radial-gradient(circle at 50% 52%, #172d6e 0%, #0a1438 58%, #040717 100%);
        }

        .disney-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: transform 0.5s ease;
        }

        .channel.focused .disney-img,
        .channel:hover .disney-img {
            transform: scale(1.08);
        }

        /* Logo Netflix avec marge élargie à droite pour ne jamais couper le X */
        .netflix-logo {
            width: 86%;
            max-width: 260px;
            height: auto;
            overflow: visible;
            filter: drop-shadow(0 6px 14px rgba(229, 9, 20, 0.45));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .channel.focused .netflix-logo,
        .channel:hover .netflix-logo {
            transform: scale(1.12);
        }

        /* Chaînes vides (Effet Wii gris/statique) */
        .channel.empty {
            background: repeating-linear-gradient(
                45deg,
                #d6dce0,
                #d6dce0 8px,
                #cdd4d9 8px,
                #cdd4d9 16px
            );
            border-color: #c2ccd4;
            opacity: 0.78;
        }

        .channel.empty .wii-watermark {
            font-size: 2rem;
            font-weight: 800;
            color: rgba(150, 165, 175, 0.45);
            letter-spacing: 2px;
            z-index: 2;
        }

        /* Barre inférieure incurvée de la Wii */
        .wii-bottom-bar {
            height: 18vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5vw;
            background: linear-gradient(180deg, #dde4e9 0%, #c4cfd6 100%);
            border-top: 4px solid var(--wii-blue);
            box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
            border-radius: 50% 50% 0 0 / 28px 28px 0 0;
        }

        .wii-pill-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(180deg, #ffffff 0%, #d8e0e5 100%);
            border: 3px solid #a3b2bd;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15), inset 0 2px 5px #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.4rem;
            color: #6c7a86;
            letter-spacing: 1px;
        }

        .wii-clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wii-time {
            font-size: 3.4rem;
            font-weight: 700;
            color: #55626d;
            letter-spacing: 4px;
            text-shadow: 0 2px 0 #ffffff;
            font-variant-numeric: tabular-nums;
        }

        .wii-date {
            font-size: 1.3rem;
            font-weight: 600;
            color: #687682;
            margin-top: -4px;
            text-transform: capitalize;
        }

        .colon {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.2; }
        }
    </style>
</head>
<body>

    <!-- GRILLE DES 12 CHAÎNES -->
    <div class="channels-wrapper">
        <div class="channels-grid" id="grid">
            
            <!-- 1. YOUTUBE -->
            <div class="channel active-app focused" data-index="0" data-url="https://www.youtube.com">
                <div class="channel-bg bg-youtube"></div>
                <div class="channel-content">
                    <svg class="channel-icon" xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 24 24" fill="#ffffff">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    <img class="channel-logo-name" src="youtube.png" alt="YouTube" style="display:none;" onload="this.style.display='block'; this.nextElementSibling.style.display='none';">
                    <span class="channel-label">YouTube</span>
                </div>
            </div>

            <!-- 2. SPOTIFY -->
            <div class="channel active-app" data-index="1" data-url="https://open.spotify.com">
                <div class="channel-bg bg-spotify"></div>
                <div class="channel-content">
                    <svg class="channel-icon" xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 24 24" fill="#ffffff">
                        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                    </svg>
                    <img class="channel-logo-name" src="spotify.png" alt="Spotify" style="display:none;" onload="this.style.display='block'; this.nextElementSibling.style.display='none';">
                    <span class="channel-label">Spotify</span>
                </div>
            </div>

            <!-- 3. TWITCH (Image Twitch_Logo-removebg-preview.png doublée) -->
            <div class="channel active-app" data-index="2" data-url="https://www.twitch.tv">
                <div class="channel-bg bg-twitch"></div>
                <div class="channel-content">
                    <svg class="channel-icon" xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 24 24" fill="#ffffff">
                        <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
                    </svg>
                    <img class="channel-logo-name logo-twitch" src="Twitch_Logo-removebg-preview.png" alt="Twitch">
                </div>
            </div>

            <!-- 4. ANIME-SAMA -->
            <div class="channel active-app" data-index="3" data-url="https://anime-sama.to">
                <div class="channel-bg bg-anime"></div>
                <div class="channel-content">
                    <img class="channel-icon" src="61pfGOfxjmL.png" alt="Anime-Sama Icon">
                    <img class="channel-logo-name logo-animesama" src="images-removebg-preview.png" alt="Anime-Sama">
                </div>
            </div>

            <!-- 5. GOOGLE (Avec Google_logo.png et Google-logo-text.png doublé) -->
            <div class="channel active-app" data-index="4" data-url="https://www.google.fr">
                <div class="channel-bg bg-google"></div>
                <div class="channel-content">
                    <img class="channel-icon" src="Google_logo.png" alt="Google Icon">
                    <img class="channel-logo-name logo-google" src="Google-logo-text.png" alt="Google">
                </div>
            </div>

            <!-- 6. DISNEY+ -->
            <div class="channel active-app" data-index="5" data-url="https://www.disneyplus.com">
                <div class="channel-bg bg-disney"></div>
                <img class="disney-img" src="disney.png" alt="Disney+" onerror="if(this.src.endsWith('disney.png')) this.src='disney.jpg';">
            </div>

            <!-- 7. NETFLIX -->
            <div class="channel active-app" data-index="6" data-url="https://www.netflix.com">
                <div class="channel-bg bg-netflix"></div>
                <div class="channel-content">
                    <svg class="netflix-logo" xmlns="http://www.w3.org/2000/svg" viewBox="-20 -15 600 160" fill="#E50914">
                        <path d="M10 10 H32 L62 82 V10 H84 V120 H62 L32 48 V120 H10 Z"/>
                        <path d="M102 10 H162 V30 H124 V54 H154 V74 H124 V100 H164 V120 H102 Z"/>
                        <path d="M178 10 H246 V30 H223 V120 H201 V30 H178 Z"/>
                        <path d="M262 10 H322 V30 H284 V56 H314 V76 H284 V120 H262 Z"/>
                        <path d="M338 10 H360 V100 H396 V120 H338 Z"/>
                        <path d="M412 10 H434 V120 H412 Z"/>
                        <path d="M452 10 H476 L492 48 L508 10 H532 L504 65 L534 120 H510 L492 82 L474 120 H450 L480 65 Z"/>
                    </svg>
                </div>
            </div>

            <!-- 8 à 12 : CHAÎNES VIDES POUR LE LOOK WII -->
            <div class="channel empty" data-index="7"><span class="wii-watermark">Wii</span></div>
            <div class="channel empty" data-index="8"><span class="wii-watermark">Wii</span></div>
            <div class="channel empty" data-index="9"><span class="wii-watermark">Wii</span></div>
            <div class="channel empty" data-index="10"><span class="wii-watermark">Wii</span></div>
            <div class="channel empty" data-index="11"><span class="wii-watermark">Wii</span></div>

        </div>
    </div>

    <!-- BARRE INFÉRIEURE WII -->
    <div class="wii-bottom-bar">
        <div class="wii-pill-btn">Wii</div>
        <div class="wii-clock-container">
            <div class="wii-time" id="clock">12<span class="colon">:</span>00</div>
            <div class="wii-date" id="date">Mer 28/10</div>
        </div>
        <div class="wii-pill-btn">TV</div>
    </div>

    <script>
        // --- 1. SYNTHÉTISEUR AUDIO WII (Web Audio API) ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playWiiSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'hover') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.065);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.start(now);
                    osc.stop(now + 0.07);
                } else if (type === 'select') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                }
            } catch (e) {}
        }

        // --- 2. HORLOGE & DATE EN TEMPS RÉEL ---
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerHTML = `${hours}<span class="colon">:</span>${minutes}`;

            const days = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
            const dayName = days[now.getDay()];
            const dayNum = String(now.getDate()).padStart(2, '0');
            const monthNum = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('date').textContent = `${dayName} ${dayNum}/${monthNum}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 3. NAVIGATION TÉLÉCOMMANDE (D-PAD) & SOURIS ---
        const channels = Array.from(document.querySelectorAll('.channel'));
        let currentIndex = 0;
        const COLS = 4;

        function setFocus(index) {
            if (index < 0 || index >= channels.length) return;
            channels[currentIndex].classList.remove('focused');
            currentIndex = index;
            channels[currentIndex].classList.add('focused');
            playWiiSound('hover');
        }

        function launchChannel(channelEl) {
            const url = channelEl.getAttribute('data-url');
            if (!url) return;
            playWiiSound('select');
            channelEl.classList.add('launching');
            setTimeout(() => {
                window.location.href = url;
            }, 280);
        }

        channels.forEach((ch, idx) => {
            ch.addEventListener('mouseenter', () => {
                if (currentIndex !== idx) setFocus(idx);
            });
            ch.addEventListener('click', () => {
                setFocus(idx);
                launchChannel(ch);
            });
        });

        window.addEventListener('keydown', (e) => {
            const key = e.key;
            const code = e.keyCode;

            if (key === 'ArrowRight' || code === 39) {
                e.preventDefault();
                if (currentIndex < channels.length - 1) setFocus(currentIndex + 1);
            } else if (key === 'ArrowLeft' || code === 37) {
                e.preventDefault();
                if (currentIndex > 0) setFocus(currentIndex - 1);
            } else if (key === 'ArrowDown' || code === 40) {
                e.preventDefault();
                if (currentIndex + COLS < channels.length) setFocus(currentIndex + COLS);
            } else if (key === 'ArrowUp' || code === 38) {
                e.preventDefault();
                if (currentIndex - COLS >= 0) setFocus(currentIndex - COLS);
            } else if (key === 'Enter' || code === 13) {
                e.preventDefault();
                launchChannel(channels[currentIndex]);
            }
        });
    </script>
</body>
</html>
